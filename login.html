<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <title>Signing in to FlightDeckIQ...</title>
  <script>
    // Strip referrer by navigating via a data: URL trick isn't reliable cross-browser.
    // Instead open Base44 app directly — the no-referrer meta tag above prevents
    // flightdeckiq.com being sent as the referring URL.
    window.location.replace('https://app.flightdeckiq.com');
  </script>
</head>
<body></body>
</html>
